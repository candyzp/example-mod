name: Build CBF+ for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build CBF+ iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CBF+
        id: geode
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          combine: false

      - name: Verify package
        shell: bash
        run: |
          PACKAGE=$(find "${{ steps.geode.outputs.build-output }}" -name 'candyzp.cbfplus.geode' -print -quit)
          test -n "$PACKAGE"
          unzip -l "$PACKAGE" | grep -F 'candyzp.cbfplus.ios.dylib'
          unzip -p "$PACKAGE" mod.json | grep -F '"version": "v0.1.0"'

      - name: Upload CBF+ package
        uses: actions/upload-artifact@v4
        with:
          name: CBFPlus-iOS
          path: ${{ steps.geode.outputs.build-output }}/*.geode
          if-no-files-found: error
