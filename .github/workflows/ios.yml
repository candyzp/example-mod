name: Build CBF+ for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS binary
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore CBF+ logo
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = Path("assets/logo.b64").read_text().strip()
          Path("logo.png").write_bytes(base64.b64decode(encoded))
          PY

      - name: Build CBF+
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          combine: true

  package:
    name: Package and verify .geode
    runs-on: ubuntu-latest
    needs: [build-ios]

    steps:
      - name: Combine iOS build
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Verify package contents
        shell: bash
        run: |
          PACKAGE=$(find "${{ steps.build.outputs.build-output }}" -name 'candyzp.cbfplus.geode' -print -quit)
          test -n "$PACKAGE"
          unzip -l "$PACKAGE" | grep -F 'candyzp.cbfplus.ios.dylib'
          unzip -l "$PACKAGE" | grep -F 'logo.png'

      - name: Upload CBF+ package
        uses: actions/upload-artifact@v4
        with:
          name: CBFPlus-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
